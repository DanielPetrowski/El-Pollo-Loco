<!DOCTYPE html>
<html lang="en" translate="no" user-scalable="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="img/Favicon/Chicken.png">
</head>

<body>
    <h1>El Pollo Loco</h1>

    <div id="fullscreen" class="fullscreen">
        <div id="turnPhoneMessage" class="turnPhoneMessage">Turn your phone<br>to play</div>

        <div class="startScreenContainer screens" id="startScreenContainer">
            <img src="./img/9_intro_outro_screens/start/startscreen_2.png" alt="">
            <div class="startScreenButtons">
                <button class="startButton" id="startButton" onclick="startGame()">Start Game</button>
            </div>
        </div>

        <div class="youWonScreen screens d-none" id="wonGameScreen">
            <img src="img/You won, you lost/You Win A.png" alt="You Win">
            <button class="restartButton" onclick="startGame()">Restart Game</button>
        </div>

        <div class="gameOverScreen screens d-none" id="gameOverScreen">
            <img src="./img/9_intro_outro_screens/game_over/game over!.png" alt="">
            <button class="restartButton" onclick="startGame()">Restart Game</button>
        </div>

        <div class="hud d-none" id="hud">
            <div id="panelup" class="panel panelup panel-wrapper">
                <button class="controlButtons" id="btnMute" onclick="toggleMute()">
                    <img id="muteIcon" src="img/icons/activeSound.png" alt="Mute Icon" width="32" height="32">
                </button>
                <button class="controlButtons hideOnPhone" id="btnFullscreen" onclick="fullscreen()">
                    <img id="fullscreenIcon" src="img/icons/fullscreen.png" alt="Fullscreen Icon" width="32" height="32">
                </button>
            </div>

            <div id="paneldown" class="panel paneldown d-none">
                <div class="panel-wrapper">
                    <button class="controlButtons" id="btnLeft">
                        <img id="leftIcon" src="img/icons/arrowLeft.png" alt="Left Icon" width="32" height="32">
                    </button>
                    <button class="controlButtons" id="btnRight">
                        <img id="rightIcon" src="img/icons/arrowRight.png" alt="Right Icon" width="44" height="44">
                    </button>
                </div>

                <div class="panel-wrapper">
                    <button class="controlButtons" id="btnJump">
                        <img id="jumpIcon" src="img/icons/jump.png" alt="Jump Icon" width="60" height="60">
                    </button>
                    <button class="controlButtons" id="btnThrow">
                        <img id="throwIcon" src="img/icons/bottle.png" alt="Throw Icon" width="60" height="60">
                    </button>
                </div>
            </div>
        </div>

        <canvas class="d-none" id="canvas" width="720" height="480"></canvas>
    </div>

    <div class="controls-box">
        <h2>CONTROL</h2>
        <div class="controls">
            <div>WALK - Arrow keys</div>
            <div>JUMP - Space</div>
            <div>THROW - X</div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p class="copyright">
                &copy; 2025 Daniel Petrowski 
                <a href="impressum.html" title="Impressum" aria-label="Legal Notice (page with legal information)">Impressum</a>
            </p>
        </div>
    </footer>

    <script src="./models/world.class.js"></script>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/small-chicken.class.js"></script>
    <script src="./models/salsa-bottle.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/levels.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/bar.class.js"></script>
    <script src="./models/endboss-lifebar.class.js"></script>
    <script src="./models/health-bar.class.js"></script>
    <script src="./models/coin-bar.class.js"></script>
    <script src="./models/bottle-bar.class.js"></script>
    <script src="./scripts/game.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./levels/level1.js"></script>
</body>

</html>
