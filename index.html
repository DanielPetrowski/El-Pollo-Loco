<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="img/Favicon/kaktus.png" />
    <link rel="shortcut icon" href="./img/Favicon/Chicken.png" type="image/x-icon">
    <title>El Pollo Loco</title>
    <script src="models/drawable-object.class.js"></script>
    <script src="./models/moveable-objects.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/small_chicken.class.js"></script>
    <script src="./models/clouds.class.js"></script>
    <script src="./models/coins.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    
    <script src="./models/world.class.js"></script>
    <script src="./models/soundHub.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/endbossBar.class.js"></script>
    <script src="./levels/level1.js"></script>
  </head>

  <body onload="init()">
    <h1>El pollo loco</h1>

    <div class="game-screen">
      <div id="startScreen" class="start-screen">
        <div class="start-button-container">
          <button class="start-btn" onclick="startGame()">Start</button>
          <div class="fullscreen-volume-container">
            <button onclick="showImpressum()">Impressum</button>
            <button class="fullScreen-icon" onclick="fullScreen()">
              <p>&#9974</p>
            </button>
          </div>
        </div>
        <div class="controls" id="controls">
          <p>Move Left and Right</p>
          <p>&#8592</p>
          <p>&#8594</p>
          <p>Jump</p>
          <p>&#8593</p>
          <p>Throw Bottle</p>
          <p>D</p>
        </div>
      </div>

      <button id="audio_button" class="audio-btn" onclick="toggleAudio()"></button>

      <div id="gameoverScreen" class="gameover-screen">
        <div class="gameover-button-container">
          <button class="restart-btn" onclick="restartGame()">Play again</button>
          <button class="back-btn" onclick="backToStartScreen()">Leave Game</button>
        </div>
      </div>

      <div id="winScreen" class="win-screen">
        <div class="gameover-button-container">
          <button class="restart-btn" onclick="restartGame()">Play again</button>
          <button class="back-btn" onclick="backToStartScreen()">Leave Game</button>
        </div>
      </div>

      <canvas id="canvas" class="canvas" width="720" height="480"></canvas>

      <dialog id="impressum" class="impressum">
        <h1>Impressum</h1>
        
        <button onclick="closeImpressum()" class="arrow-back">↩</button>
        <section class="impressum-details">
         
        </section>
      </dialog>
    </div>
    <div id="rotatePhone" class="rotate-phone">
      <img class="rotate-img" src="img/5_background/rotate your phone.jpg" alt="" />
      <p class="rotate-img"> rotate your Phone</p>
    </div>
  </body>
  <script src="./scripts/game.js"></script>
</html>
